<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="panelaTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="panelaSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#fef3c7" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Bloque Isométrico 3D de Panela Colombiana (Pastilla Cuadrada) -->
    <!-- Cara Superior -->
    <path d="M120 150 L200 100 L280 150 L200 200 Z" fill="url(#panelaTop)" stroke="#d97706" stroke-width="2"/>
    
    <!-- Cara Izquierda -->
    <path d="M120 150 L120 220 L200 270 L200 200 Z" fill="url(#panelaSide)" stroke="#92400e" stroke-width="1.5"/>

    <!-- Cara Derecha -->
    <path d="M280 150 L280 220 L200 270 L200 200 Z" fill="#522105" stroke="#78350f" stroke-width="1.5"/>

    <!-- Vetas naturales de miel de caña / trapiche -->
    <path d="M150 145 Q200 135 240 160" stroke="#f59e0b" stroke-width="2" opacity="0.3" fill="none"/>
    <path d="M160 170 Q200 160 250 175" stroke="#f59e0b" stroke-width="2" opacity="0.3" fill="none"/>

    <!-- Cintas de Caña de Azúcar decorativas -->
    <line x1="80" y1="280" x2="100" y2="200" stroke="#15803d" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="270" x2="115" y2="210" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>

    <!-- Sello Frontal Tradicional -->
    <rect x="105" y="275" width="190" height="52" rx="12" fill="#15803d" stroke="#22c55e" stroke-width="2"/>
    <text x="200" y="298" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">PANELA EN PASTILLA</text>
    <text x="200" y="316" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">100% Trapiche Panelero · 500 g</text>
  </g>
</svg>
