<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="blueBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#dbeafe" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Bloque Redondo de Quesito Antioqueño estilo Colanta -->
    <!-- Cuerpo Cilíndrico 3D -->
    <path d="M100 170 L100 240 Q200 295 300 240 L300 170 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="200" cy="170" rx="100" ry="45" fill="url(#cheese)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Textura de hoja / molde tradicional de quesito -->
    <ellipse cx="200" cy="170" rx="85" ry="36" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="6,4"/>

    <!-- Etiqueta Circular Superior Colanta Style -->
    <ellipse cx="200" cy="170" rx="72" ry="30" fill="url(#blueBand)" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Flor/Trébol de Colanta -->
    <circle cx="200" cy="155" r="7" fill="#ffffff"/>
    <circle cx="193" cy="155" r="5" fill="#22c55e"/>
    <circle cx="207" cy="155" r="5" fill="#22c55e"/>
    <circle cx="200" cy="148" r="5" fill="#22c55e"/>

    <text x="200" y="174" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">COLANTA</text>
    <text x="200" y="188" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fde047" text-anchor="middle">QUESITO ANTIOQUEÑO</text>

    <!-- Faja Frontal de Empaque -->
    <path d="M100 205 Q200 260 300 205 L300 238 Q200 293 100 238 Z" fill="url(#blueBand)"/>
    <text x="200" y="244" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">QUESITO FRESCO 400 g</text>
    <text x="200" y="260" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fde047" text-anchor="middle">Semigraso · Blando · 100% Leche Pura</text>
  </g>
</svg>
