<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="choc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="35%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#3c1502"/>
      <stop offset="100%" stop-color="#270e01"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#fef2f2" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Barra Tradicional de Chocolate Corona -->
    <rect x="95" y="85" width="210" height="235" rx="16" fill="url(#choc)" stroke="#ca8a04" stroke-width="3"/>
    
    <!-- Relieve de pastillas de chocolate -->
    <rect x="110" y="100" width="180" height="30" rx="6" fill="#2d1102" stroke="#5c2606" stroke-width="1.5"/>
    <rect x="110" y="275" width="180" height="30" rx="6" fill="#2d1102" stroke="#5c2606" stroke-width="1.5"/>

    <!-- Marco Dorado Central -->
    <rect x="110" y="140" width="180" height="125" rx="10" fill="#1c0a00" stroke="url(#gold)" stroke-width="2"/>

    <!-- Corona Dorada Icónica -->
    <path d="M175 178 L185 160 L200 174 L215 160 L225 178 Z" fill="url(#gold)"/>
    <circle cx="185" cy="158" r="3" fill="#fde047"/>
    <circle cx="200" cy="172" r="3.5" fill="#fde047"/>
    <circle cx="215" cy="158" r="3" fill="#fde047"/>

    <!-- Nombre CORONA -->
    <text x="200" y="208" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="2">CORONA</text>
    
    <text x="200" y="226" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">TRADICIONAL</text>
    <text x="200" y="242" font-family="Arial, sans-serif" font-size="9" fill="#fde047" text-anchor="middle">Pastillas de Chocolate de Mesa</text>

    <!-- Taza humeante y peso -->
    <text x="145" y="296" font-size="16">☕</text>
    <text x="220" y="296" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#fde047" text-anchor="middle">500 g</text>
  </g>
</svg>
