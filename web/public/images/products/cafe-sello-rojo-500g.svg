<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="redPouch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="80%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#fee2e2" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Bolsa de Café Sello Rojo -->
    <path d="M125 70 Q200 62 275 70 L288 325 Q200 338 112 325 Z" fill="url(#redPouch)" stroke="#7f1d1d" stroke-width="2"/>
    
    <!-- Pliegues superiores -->
    <rect x="125" y="70" width="150" height="20" rx="3" fill="#7f1d1d"/>
    <line x1="135" y1="80" x2="265" y2="80" stroke="#fca5a5" stroke-dasharray="3,3" stroke-width="1.5"/>

    <!-- Sello Rojo / Dorado Central -->
    <circle cx="200" cy="180" r="62" fill="#7f1d1d" stroke="#facc15" stroke-width="4"/>
    <circle cx="200" cy="180" r="54" fill="#dc2626" stroke="#facc15" stroke-width="1"/>

    <!-- Granos de café en el sello -->
    <ellipse cx="188" cy="148" rx="8" ry="5" fill="#451a03" transform="rotate(-30 188 148)"/>
    <ellipse cx="212" cy="148" rx="8" ry="5" fill="#451a03" transform="rotate(30 212 148)"/>

    <text x="200" y="176" font-family="'Arial Black', Impact, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">CAFÉ</text>
    <text x="200" y="196" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="1">SELLO ROJO</text>
    <text x="200" y="212" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">TOSTADO Y MOLIDO</text>

    <!-- Cinta y Eslogan -->
    <rect x="135" y="258" width="130" height="22" rx="6" fill="#facc15"/>
    <text x="200" y="273" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Aroma que nos une</text>

    <!-- Peso Neto -->
    <text x="200" y="306" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">500 g</text>
    <text x="200" y="322" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fca5a5" text-anchor="middle">Café 100% Colombiano</text>
  </g>
</svg>
