<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="soapTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="soapSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#dbeafe" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Barra Azul Rectangular 3D de Jabón Rey -->
    <!-- Cara Superior -->
    <path d="M90 150 L200 90 L310 150 L200 210 Z" fill="url(#soapTop)" stroke="#60a5fa" stroke-width="2"/>
    
    <!-- Cara Izquierda -->
    <path d="M90 150 L90 220 L200 280 L200 210 Z" fill="url(#soapSide)" stroke="#1e3a8a" stroke-width="1.5"/>

    <!-- Cara Derecha -->
    <path d="M310 150 L310 220 L200 280 L200 210 Z" fill="#1e3a8a" stroke="#172554" stroke-width="1.5"/>

    <!-- Grabado en Bajo Relieve Superior de la Corona y Letras REY -->
    <g transform="rotate(-5 200 150)">
      <!-- Corona en bajo relieve -->
      <path d="M185 135 L192 120 L200 132 L208 120 L215 135 Z" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1"/>
      <circle cx="192" cy="118" r="2.5" fill="#facc15"/>
      <circle cx="200" cy="130" r="3" fill="#facc15"/>
      <circle cx="208" cy="118" r="2.5" fill="#facc15"/>

      <!-- Letras REY -->
      <text x="200" y="165" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="#1e40af" stroke="#93c5fd" stroke-width="1.5" text-anchor="middle" letter-spacing="3">REY</text>
      <text x="200" y="180" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#bfdbfe" text-anchor="middle" letter-spacing="1">JABÓN MULTIUSOS</text>
    </g>

    <!-- Faja Frontal con Leyenda -->
    <rect x="110" y="275" width="180" height="50" rx="10" fill="#1e40af" stroke="#60a5fa" stroke-width="2"/>
    <text x="200" y="297" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">JABÓN REY 300 g</text>
    <text x="200" y="314" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fde047" text-anchor="middle">El de toda la vida en Colombia</text>
  </g>
</svg>
