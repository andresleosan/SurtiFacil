<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="colantaRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="colantaBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#dbeafe" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Bolsa de Leche Colanta 1L UHT -->
    <path d="M135 65 Q200 55 265 65 L285 335 Q200 350 115 335 Z" fill="url(#pouch)"/>
    
    <!-- Sellado térmico superior e inferior con relieve -->
    <path d="M135 65 Q200 55 265 65 L267 80 Q200 70 133 80 Z" fill="#cbd5e1"/>
    <path d="M115 320 Q200 335 285 320 L285 335 Q200 350 115 335 Z" fill="#cbd5e1"/>

    <!-- Cabecera Azul Colanta -->
    <path d="M133 80 Q200 70 267 80 L271 135 Q200 120 129 135 Z" fill="url(#colantaBlue)"/>
    
    <!-- Trébol Colanta -->
    <circle cx="200" cy="100" r="11" fill="#ffffff"/>
    <circle cx="193" cy="100" r="8" fill="#16a34a"/>
    <circle cx="207" cy="100" r="8" fill="#16a34a"/>
    <circle cx="200" cy="93" r="8" fill="#16a34a"/>

    <text x="200" y="125" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">COLANTA</text>

    <!-- Banda Roja distintiva Leche Entera -->
    <path d="M129 135 Q200 120 271 135 L275 185 Q200 170 125 185 Z" fill="url(#colantaRed)"/>
    <text x="200" y="158" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">LECHE ENTERA</text>
    <text x="200" y="174" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">PASTEURIZADA HOMOGENEIZADA</text>

    <!-- Pradera verde y colinas antioqueñas -->
    <path d="M125 240 Q170 215 205 235 Q245 220 279 245 L282 320 Q200 335 118 320 Z" fill="#16a34a"/>
    <path d="M122 255 Q160 235 200 250 Q250 240 281 260 L282 320 Q200 335 118 320 Z" fill="#15803d"/>

    <!-- Vaca lechera silueta / ícono campesino -->
    <g transform="translate(175, 230) scale(0.6)">
      <ellipse cx="40" cy="35" rx="25" ry="16" fill="#ffffff"/>
      <ellipse cx="20" cy="22" rx="12" ry="10" fill="#ffffff"/>
      <circle cx="30" cy="30" r="6" fill="#0f172a"/>
      <circle cx="48" cy="38" r="8" fill="#0f172a"/>
      <!-- Patas -->
      <rect x="22" y="45" width="5" height="18" rx="2" fill="#ffffff"/>
      <rect x="32" y="45" width="5" height="18" rx="2" fill="#ffffff"/>
      <rect x="46" y="45" width="5" height="18" rx="2" fill="#ffffff"/>
      <rect x="56" y="45" width="5" height="18" rx="2" fill="#ffffff"/>
    </g>

    <!-- Distintivo 1 Litro y 100% Campo Paisa -->
    <rect x="145" y="278" width="110" height="26" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="200" y="296" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#1e40af" text-anchor="middle">CONT. NETO 1 L</text>
  </g>
</svg>
