<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="arepa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fef9c3"/>
      <stop offset="85%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#fef9c3" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Bolsa Transparente Sellada de Arepas Paisas -->
    <rect x="110" y="70" width="180" height="260" rx="18" fill="#ffffff" fill-opacity="0.6" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Sellado superior -->
    <rect x="110" y="70" width="180" height="22" rx="4" fill="#059669"/>
    <line x1="120" y1="81" x2="280" y2="81" stroke="#34d399" stroke-dasharray="4,4" stroke-width="2"/>

    <!-- Pila de 10 arepas de tela antioqueñas vistas desde el frente -->
    <g>
      <!-- Capas de arepas apiladas -->
      <ellipse cx="200" cy="180" rx="75" ry="25" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
      <ellipse cx="200" cy="195" rx="75" ry="25" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
      <ellipse cx="200" cy="210" rx="75" ry="25" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
      <ellipse cx="200" cy="225" rx="75" ry="25" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
      <ellipse cx="200" cy="240" rx="75" ry="25" fill="url(#arepa)" stroke="#ca8a04" stroke-width="1.5"/>

      <!-- Quemaditas / Huellas de parrilla típicas paisas -->
      <ellipse cx="170" cy="235" rx="10" ry="4" fill="#78350f" opacity="0.4" transform="rotate(-15 170 235)"/>
      <ellipse cx="225" cy="242" rx="12" ry="5" fill="#78350f" opacity="0.35" transform="rotate(10 225 242)"/>
      <ellipse cx="195" cy="245" rx="8" ry="3" fill="#78350f" opacity="0.5"/>
    </g>

    <!-- Cinta y Etiqueta Antioqueña (Verde y Blanca) -->
    <rect x="120" y="105" width="160" height="65" rx="10" fill="#047857" stroke="#10b981" stroke-width="2"/>
    <rect x="120" y="132" width="160" height="12" fill="#ffffff"/>
    <text x="200" y="125" font-family="'Arial Black', sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">AREPAS DE TELA</text>
    <text x="200" y="142" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#047857" text-anchor="middle">100% MAÍZ BLANCO PETO</text>
    <text x="200" y="160" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">Paisa Tradicional</text>

    <!-- Paquete x10 Badge -->
    <rect x="135" y="280" width="130" height="34" rx="8" fill="#dc2626"/>
    <text x="200" y="302" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">PAQUETE x 10</text>
  </g>
</svg>
