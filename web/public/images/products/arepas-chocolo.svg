<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="chocoloBag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="arepaGolden" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#fef08a" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Bolsa de Arepas de Chócolo -->
    <path d="M110 80 L290 80 L305 325 Q200 345 95 325 Z" fill="url(#chocoloBag)" stroke="#eab308" stroke-width="2"/>
    
    <!-- Sellado superior -->
    <rect x="110" y="70" width="180" height="18" fill="#ca8a04" rx="4"/>
    <line x1="120" y1="79" x2="280" y2="79" stroke="#fef08a" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Cabecera Don Maíz / Sabor Campesino -->
    <path d="M109 88 L291 88 L295 145 Q200 135 105 145 Z" fill="#15803d"/>
    <text x="200" y="118" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">DON MAÍZ</text>
    <text x="200" y="136" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fef08a" text-anchor="middle">TRADICIÓN CAMPESINA</text>

    <!-- Arepa dorada de chócolo visible en el centro -->
    <circle cx="200" cy="215" r="62" fill="url(#arepaGolden)" stroke="#b45309" stroke-width="2"/>
    <!-- Pecas / marcas doradas asadas de tiesto -->
    <circle cx="175" cy="190" r="5" fill="#78350f" opacity="0.7"/>
    <circle cx="225" cy="185" r="6" fill="#78350f" opacity="0.7"/>
    <circle cx="190" cy="225" r="4" fill="#78350f" opacity="0.7"/>
    <circle cx="230" cy="235" r="5" fill="#78350f" opacity="0.7"/>
    <circle cx="165" cy="230" r="4" fill="#78350f" opacity="0.7"/>

    <!-- Loncha de queso blanco / quesito derretido encima -->
    <path d="M180 185 Q200 175 220 185 L225 210 Q200 220 175 210 Z" fill="#ffffff" stroke="#fef08a" stroke-width="1.5"/>

    <!-- Franja con el nombre del producto -->
    <rect x="120" y="270" width="160" height="32" rx="8" fill="#b45309"/>
    <text x="200" y="291" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">AREPAS DE CHÓCOLO</text>

    <!-- Badges inferiores -->
    <rect x="135" y="306" width="130" height="18" rx="5" fill="#15803d"/>
    <text x="200" y="319" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">PAQUETE x5 UNIDADES</text>
  </g>
</svg>
