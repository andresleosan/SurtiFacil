<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="noelBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="cracker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#e0f2fe" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Paquete rectangular de Galletas Saltín Noel -->
    <rect x="85" y="100" width="230" height="200" rx="14" fill="url(#noelBlue)" stroke="#0369a1" stroke-width="2"/>
    
    <!-- Sellado plisado en los bordes laterales -->
    <rect x="75" y="105" width="12" height="190" rx="3" fill="#0284c7" opacity="0.8"/>
    <rect x="313" y="105" width="12" height="190" rx="3" fill="#0369a1" opacity="0.8"/>

    <!-- Banda Roja Superior con Logo Noel -->
    <path d="M85 100 L315 100 L315 155 L85 155 Z" fill="#dc2626"/>
    
    <!-- Círculo blanco Noel con Papá Noel o estrella -->
    <circle cx="125" cy="127" r="16" fill="#ffffff"/>
    <text x="125" y="132" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#dc2626" text-anchor="middle">NOEL</text>

    <text x="215" y="133" font-family="'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">Saltín</text>

    <!-- Galleta dorada crujiente con huequitos (puntitos) -->
    <g transform="translate(195, 175)">
      <rect x="0" y="0" width="90" height="75" rx="6" fill="url(#cracker)" stroke="#d97706" stroke-width="2"/>
      
      <!-- Bordes ondulados de galleta saltín -->
      <!-- Matriz de agujeros de cocción (3x4) -->
      <circle cx="20" cy="18" r="2.5" fill="#92400e"/>
      <circle cx="45" cy="18" r="2.5" fill="#92400e"/>
      <circle cx="70" cy="18" r="2.5" fill="#92400e"/>

      <circle cx="20" cy="38" r="2.5" fill="#92400e"/>
      <circle cx="45" cy="38" r="2.5" fill="#92400e"/>
      <circle cx="70" cy="38" r="2.5" fill="#92400e"/>

      <circle cx="20" cy="58" r="2.5" fill="#92400e"/>
      <circle cx="45" cy="58" r="2.5" fill="#92400e"/>
      <circle cx="70" cy="58" r="2.5" fill="#92400e"/>

      <!-- Cristales de sal marina -->
      <rect x="28" y="26" width="3" height="3" fill="#ffffff"/>
      <rect x="58" y="46" width="3" height="3" fill="#ffffff"/>
      <rect x="36" y="52" width="3" height="3" fill="#ffffff"/>
    </g>

    <!-- Texto descriptivo en la parte izquierda -->
    <text x="140" y="185" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#fde047" text-anchor="middle">TRADICIONAL</text>
    <text x="140" y="202" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Galletas de Sal Crocantes</text>
    <text x="140" y="218" font-family="Arial, sans-serif" font-size="8.5" fill="#e0f2fe" text-anchor="middle">Ideales con Quesito Paisa</text>

    <!-- Cinta de presentación 3 Tacos -->
    <rect x="105" y="260" width="190" height="26" rx="6" fill="#fde047"/>
    <text x="200" y="278" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#0369a1" text-anchor="middle">PAQUETE x3 TACOS (300 g)</text>
  </g>
</svg>
