<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <radialGradient id="avocadoFlesh" cx="45%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FCFAD2"/>
      <stop offset="55%" stop-color="#C5E063"/>
      <stop offset="85%" stop-color="#6F9D28"/>
      <stop offset="100%" stop-color="#2D5A1E"/>
    </radialGradient>
    <radialGradient id="avocadoSkin" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3A4D28"/>
      <stop offset="70%" stop-color="#1B2B11"/>
      <stop offset="100%" stop-color="#0E1709"/>
    </radialGradient>
    <radialGradient id="pitGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A76843"/>
      <stop offset="50%" stop-color="#6F3918"/>
      <stop offset="100%" stop-color="#3C1A06"/>
    </radialGradient>
    <filter id="avocadoDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sombra en base -->
  <ellipse cx="100" cy="222" rx="60" ry="10" fill="#CBD5E1"/>

  <!-- Aguacate Hass - Corte Transversal -->
  <g filter="url(#avocadoDrop)">
    <!-- Cáscara rugosa exterior (Piel de cocodrilo Hass) -->
    <path d="M100,20 C130,20 162,70 165,130 C168,185 140,218 100,218 C60,218 32,185 35,130 C38,70 70,20 100,20 Z" 
          fill="url(#avocadoSkin)" stroke="#0E1709" stroke-width="3"/>

    <!-- Pulpa cremosa -->
    <path d="M100,25 C126,25 155,73 158,128 C160,180 135,212 100,212 C65,212 40,180 42,128 C45,73 74,25 100,25 Z" 
          fill="url(#avocadoFlesh)"/>

    <!-- Cavidad y Pepa (Hueso) -->
    <!-- Sombra de la cavidad -->
    <ellipse cx="100" cy="148" rx="38" ry="42" fill="#5A3215" opacity="0.4"/>
    
    <!-- Semilla esférica lisa -->
    <ellipse cx="100" cy="146" rx="36" ry="40" fill="url(#pitGradient)"/>
    <!-- Brillo en la semilla -->
    <ellipse cx="90" cy="132" rx="10" ry="8" fill="#FFFFFF" opacity="0.35" transform="rotate(-15, 90, 132)"/>
  </g>

  <!-- Insignia "Hass Colombiano" -->
  <g transform="translate(100, 32)">
    <rect x="-42" y="0" width="84" height="18" rx="9" fill="#15803D" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="0" y="12" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      🥑 HASS PAISA
    </text>
  </g>
</svg>
